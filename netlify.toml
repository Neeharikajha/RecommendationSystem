[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"
  functions = "backend"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[env.production]
  [env.production.context.environment]
    VITE_BACKEND_URL = "https://recommendationsystem-s0gt.onrender.com/api"
    VITE_TMDB_KEY = ""
